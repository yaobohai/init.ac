name: build and deployment
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Branch
      uses: actions/checkout@master
    - name: 预备环境
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.0
        bundler-cache: true
    - name: 构建站点
      run: |
        sudo pip install https://github.com/tencentyun/coscmd/archive/refs/heads/master.zip
        bundle exec jekyll build --trace --profile
    - name: 仓库配置
      env:
        BUCKET: ${{ secrets.COS_BUCKET_NAME }}
        SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        REGION: ${{ secrets.COS_REGION }}
      run: |
        coscmd config -a $SECRET_ID -s $SECRET_KEY -b $BUCKET -r $REGION
    - name: 部署站点
      run: |
        coscmd upload -rfs --delete ./_site/ /
    - name: 构建docker镜像
        run: |
          docker login --username=${{ secrets.DOCKER_REGISTRY_USERNAME }} --password=${{ secrets.DOCKER_REGISTRY_PASSWORD }} ${{ secrets.DOCKER_REGISTRY_ADDR }} \
          && docker build . -t ${{ secrets.DOCKER_REGISTRY_ADDR }}/bohai_repo/jekyll:latest \
          && docker push ${{ secrets.DOCKER_REGISTRY_ADDR }}/bohai_repo/jekyll:latest